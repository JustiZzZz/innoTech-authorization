services:
  postgres:
    image: postgres:16-alpine
    container_name: innotech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-innotech_auth}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d innotech_auth"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: innotech-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: innotech-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/innotech_auth
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      APP_BASE_URL: http://localhost:8000
      SECRET_KEY: ${SECRET_KEY:-super-secret-key-for-innotech-auth-min-32-chars-long!}
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      JWT_ALGORITHM: HS256
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - app_network

volumes:
  pgdata:

networks:
  app_network:
    driver: bridge