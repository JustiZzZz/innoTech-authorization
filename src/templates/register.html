<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | InnoTech Solutions</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 36px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid #e1e4e8;
        }
        h2 { margin-top: 0; color: #1a202c; text-align: center; }
        p.subtitle { color: #718096; font-size: 14px; text-align: center; margin-bottom: 24px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #4a5568; margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: #0066cc; }
        button {
            width: 100%;
            padding: 12px;
            background: #0066cc;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #0052a3; }
        .alert {
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            margin-top: 20px;
            display: none;
            line-height: 1.5;
        }
        .alert-success { background: #e6fffa; color: #234e52; border: 1px solid #b2f5ea; }
        .alert-error { background: #fff5f5; color: #9b2c2c; border: 1px solid #fed7d7; }
        .mailpit-link { display: inline-block; margin-top: 8px; font-weight: bold; color: #0066cc; }
    </style>
</head>
<body>
    <div class="card">
        <h2>InnoTech Solutions</h2>
        <p class="subtitle">Регистрация и подтверждение через Email</p>

        <form id="registerForm">
            <div class="form-group">
                <label for="email">Электронная почта (Email):</label>
                <input type="email" id="email" required placeholder="ivan@innotech.by">
            </div>
            <div class="form-group">
                <label for="password">Пароль (минимум 8 символов):</label>
                <input type="password" id="password" required minlength="8" placeholder="••••••••">
            </div>
            <button type="submit" id="submitBtn">Зарегистрироваться</button>
        </form>

        <div id="alertSuccess" class="alert alert-success">
            <strong>Письмо отправлено!</strong><br>
            Мы выслали ссылку для подтверждения.<br>
            <a href="http://localhost:8025" target="_blank" class="mailpit-link">👉 Открыть почту в Mailpit (:8025)</a>
        </div>

        <div id="alertError" class="alert alert-error"></div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const alertSuccess = document.getElementById('alertSuccess');
            const alertError = document.getElementById('alertError');

            alertSuccess.style.display = 'none';
            alertError.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Отправка...';

            try {
                const response = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alertSuccess.style.display = 'block';
                    document.getElementById('registerForm').reset();
                } else {
                    alertError.textContent = data.detail || 'Произошла ошибка при регистрации';
                    alertError.style.display = 'block';
                }
            } catch (err) {
                alertError.textContent = 'Не удалось связаться с сервером';
                alertError.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Зарегистрироваться';
            }
        });
    </script>
</body>
</html>
